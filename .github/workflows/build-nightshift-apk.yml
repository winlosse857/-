name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "nightshift_android/**"
      - ".github/workflows/build-nightshift-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nightshift_android
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: nightshift_android/pubspec.yaml
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name nightshift .
      - name: Get dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightshift-release-apk
          path: nightshift_android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
