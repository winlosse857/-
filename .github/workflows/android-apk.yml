name: Build Dolbagram Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'noir_chat/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if missing
        working-directory: noir_chat
        run: flutter create --platforms=android --org com.dolbagram --project-name dolbagram .
      - name: Install dependencies
        working-directory: noir_chat
        run: flutter pub get
      - name: Build release APK
        working-directory: noir_chat
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolbagram-android-apk
          path: noir_chat/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dolbagram-latest --yes || true
          git push origin :refs/tags/dolbagram-latest || true
          gh release create dolbagram-latest noir_chat/build/app/outputs/flutter-apk/app-release.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Dolbagram — latest Android APK" \
            --notes "Latest automated Dolbagram Android build. Download Dolbagram.apk and open it on your Android device." \
            --prerelease \
            --latest=false
